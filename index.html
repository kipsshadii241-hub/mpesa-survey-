<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-Pesa Quick Survey - Kenya</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{margin:0;background:#f5f7f5}
.topbar{background:#00a650;color:white;padding:14px 20px;text-align:center;font-weight:700;font-size:18px}
.container{max-width:500px;margin:20px auto;padding:0 15px}
.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:16px}
h1{font-size:22px;text-align:center;margin:0 0 16px}
label{font-weight:600;display:block;margin:18px 0 8px}
input,select{width:100%;padding:14px 16px;border:1.5px solid #ddd;border-radius:12px;font-size:16px}
input:focus{border-color:#00a650;outline:none}
.btn{width:100%;background:#00a650;color:white;border:0;padding:16px;border-radius:50px;font-weight:800;font-size:16px;margin-top:20px;cursor:pointer}
.btn2{background:#0d3b2e}
.small{font-size:13px;color:#666;text-align:center;margin-top:12px}
.badge{display:inline-block;background:#e6f7ed;color:#00a650;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.stat{background:#f0faf3;border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:22px;display:block;color:#00a650}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left}
th{background:#f8f8f8}
.hidden{display:none}
.dashboard{display:none}
</style>
</head>
<body>
<div class="topbar">✅ M-PESA SURVEY KE</div>
<div class="container">
<div id="surveyCard" class="card">
<div style="text-align:center"><span class="badge">30 SECONDS • 100% FREE</span></div>
<h1>Quick Survey (30 seconds)</h1>
<label>1. Do you use M-Pesa daily?</label>
<select id="q1"><option value="">Select</option><option>Yes</option><option>No</option><option>Sometimes</option></select>
<label>2. What county are you in?</label>
<input id="q2" placeholder="e.g. Kikuyu, Nairobi">
<label>3. Your first name</label>
<input id="q3" placeholder="e.g. Kipkoech">
<button class="btn" onclick="submitSurvey()">SUBMIT SURVEY</button>
<p class="small">Your data is private. Not affiliated with Safaricom.</p>
<p class="small"><a href="#" onclick="openDash();return false;">View Dashboard (Admin)</a></p>
</div>
<div id="thanksCard" class="card hidden">
<h1 style="color:#00a650">✅ Asante! Received</h1>
<p style="text-align:center">Your response saved. Thank you!</p>
<button class="btn btn2" onclick="showSurvey()">Submit Another</button>
<button class="btn" style="background:#eee;color:#333;margin-top:10px" onclick="openDash()">View Dashboard</button>
</div>
<div id="dashboardCard" class="card dashboard">
<h1>📊 Dashboard</h1>
<div style="text-align:center"><span class="badge" id="totalBadge">0 responses</span></div>
<div class="stat-grid">
<div class="stat"><b id="sTotal">0</b>Total</div>
<div class="stat"><b id="sYes">0</b>Yes</div>
<div class="stat"><b id="sCounties">0</b>Counties</div>
</div>
<div style="display:flex;gap:8px">
<button class="btn" style="flex:1;padding:10px;font-size:14px" onclick="exportCSV()">Export CSV</button>
<button class="btn" style="flex:1;background:#ff3b30;padding:10px;font-size:14px" onclick="clearData()">Clear All</button>
</div>
<table id="dataTable"><thead><tr><th>Time</th><th>Daily?</th><th>County</th><th>Name</th></tr></thead><tbody></tbody></table>
<button class="btn" style="background:#eee;color:#333;margin-top:16px" onclick="showSurvey()">← Back</button>
</div>
</div>
<script>
const KEY='mpesa_survey_v2';
function getData(){return JSON.parse(localStorage.getItem(KEY)||'[]')}
function saveData(d){localStorage.setItem(KEY, JSON.stringify(d))}
function submitSurvey(){
 const q1=document.getElementById('q1').value.trim();
 const q2=document.getElementById('q2').value.trim();
 const q3=document.getElementById('q3').value.trim();
 if(!q1||!q2||!q3){alert('Fill all fields');return}
 const data=getData();
 data.unshift({time:new Date().toLocaleString(), q1,q2,q3});
 saveData(data);
 document.getElementById('surveyCard').classList.add('hidden');
 document.getElementById('thanksCard').classList.remove('hidden');
 renderDash();
}
function showSurvey(){
 document.getElementById('thanksCard').classList.add('hidden');
 document.getElementById('dashboardCard').style.display='none';
 document.getElementById('surveyCard').classList.remove('hidden');
 document.getElementById('q1').value='';document.getElementById('q2').value='';document.getElementById('q3').value='';
}
function openDash(){
 let pin=prompt('Enter PIN (1234):');
 if(pin!=='1234'&&pin!==''&&pin!==null){alert('Wrong PIN');return}
 if(pin===null)return;
 document.getElementById('surveyCard').classList.add('hidden');
 document.getElementById('thanksCard').classList.add('hidden');
 document.getElementById('dashboardCard').style.display='block';
 renderDash();
}
function renderDash(){
 const data=getData();
 document.getElementById('sTotal').innerText=data.length;
 document.getElementById('totalBadge').innerText=data.length+' responses';
 document.getElementById('sYes').innerText=data.filter(d=>d.q1.toLowerCase().includes('yes')).length;
 document.getElementById('sCounties').innerText=new Set(data.map(d=>d.q2.toLowerCase())).size;
 const tbody=document.querySelector('#dataTable tbody');
 tbody.innerHTML=data.map(d=>`<tr><td>${d.time}</td><td>${d.q1}</td><td>${d.q2}</td><td>${d.q3}</td></tr>`).join('')||'<tr><td colspan=4 style="text-align:center;color:#999">No data yet</td></tr>';
}
function clearData(){if(confirm('Delete all?')){localStorage.removeItem(KEY);renderDash();}}
function exportCSV(){
 const data=getData();if(!data.length){alert('No data');return}
 let csv='Time,Daily,County,Name\n'+data.map(d=>`"${d.time}","${d.q1}","${d.q2}","${d.q3}"`).join('\n');
 let blob=new Blob([csv],{type:'text/csv'});
 let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mpesa-survey.csv';a.click();
}
renderDash();
</script>
</body>
</html>
