<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KikuyuBet - Join Africa's Giant</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;margin:0;padding:0}
body{background:#f2f2f2}
.top{background:#111;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#fff}
.logo{font-weight:900;font-size:22px;color:#fff} .logo b{color:#00d455}
.btns{display:flex;gap:8px}
.btn-login{border:1px solid #555;background:transparent;color:#fff;padding:6px 14px;border-radius:4px;font-size:12px}
.btn-join{background:#00d455;color:#000;border:0;padding:6px 14px;border-radius:4px;font-weight:800;font-size:12px}
.nav{background:#fff;display:flex;gap:16px;padding:10px 14px;border-bottom:1px solid #ddd;font-size:13px;font-weight:700}
.nav span{color:#666}
.formbox{max-width:400px;margin:20px auto;background:#fff;padding:16px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;text-align:center;border-radius:6px;font-weight:700;font-size:13px;border:1px solid #ddd;cursor:pointer}
.tab.active{background:#111;color:#fff}
label{font-size:12px;color:#555;display:block;margin-top:12px;margin-bottom:4px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:14px}
input:focus{border-color:#00d455;outline:none}
.error{color:#e11;font-size:11px;margin-top:4px}
.keep{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:#555}
.btn-main{width:100%;background:#111;color:#fff;padding:14px;border:0;border-radius:6px;margin-top:16px;font-weight:800;letter-spacing:1px}
.link{text-align:center;margin-top:12px;font-size:12px;color:#555}
.link a{color:#111;font-weight:800}
.greenbar{background:#00d455;color:#000;text-align:center;padding:10px;font-size:12px;font-weight:700}
.bottom{display:flex;justify-content:space-around;background:#111;color:#aaa;padding:10px 0;font-size:11px;position:fixed;bottom:0;width:100%;max-width:400px;left:50%;transform:translateX(-50%)}
</style>
</head>
<body>
<div style="max-width:400px;margin:0 auto;background:#fff;min-height:100vh;position:relative;padding-bottom:60px">
<div class="top"><div class="logo">KIKUYU<b>BET</b></div><div class="btns"><button class="btn-login">LOGIN</button><button class="btn-join">JOIN NOW</button></div></div>
<div class="nav"><span>⚽ SPORTS</span><span>LIVE</span><span>CASINO</span><span>AVIATOR</span></div>

<div class="formbox">
<div class="tabs"><div class="tab active" onclick="switchTab('login')">→ Log In</div><div class="tab" onclick="switchTab('join')">Join Now</div></div>

<div id="loginForm">
<label>Mobile Number</label>
<div style="display:flex"><div style="background:#eee;padding:12px;border:1px solid #ccc;border-right:0;border-radius:6px 0 0 6px;font-size:14px">🇰🇪 +254</div><input id="lmobile" placeholder="7XXXXXXX" style="border-radius:0 6px 6px 0"></div>
<div id="lmobileErr" class="error"></div>

<label>Password</label><input id="lpass" type="password" placeholder="Min. 4 Characters">
<div class="keep"><input type="checkbox"> Keep me logged on this device</div>
<button class="btn-main" onclick="login()">LOG IN</button>
<div class="link"><a href="#">Forgot Password?</a></div>
</div>

<div id="joinForm" style="display:none">
<label>Mobile Number</label>
<div style="display:flex"><div style="background:#eee;padding:12px;border:1px solid #ccc;border-right:0;border-radius:6px 0 0 6px;font-size:14px">🇰🇪 +254</div><input id="jmobile" placeholder="Enter without 0 e.g. 7XXXXXXXX"></div>
<label>Password</label><input id="jpass" type="password" placeholder="Min. 4 Characters">
<label>First Name</label><input id="fname">
<label>Last Name</label><input id="lname">
<label>Location</label><select><option>Select district - Kiambu</option><option>Kikuyu</option><option>Nairobi</option><option>Nakuru</option><option>Mombasa</option><option>Uganda - Kampala</option></select>
<label>Nationality</label><select><option>Kenyan</option><option>Ugandan</option></select>
<div class="keep"><input type="checkbox" checked> By creating account you accept Terms</div>
<button class="btn-main" onclick="join()">JOIN NOW</button>
</div>

<div class="link" style="margin-top:16px">Don't have an account? <a href="#" onclick="switchTab('join');return false">Join Now</a></div>
</div>

<div class="greenbar">Add legs for up to a 1250% Win Bonus.</div>
<div class="bottom"><div>Menu</div><div>Sports</div><div style="color:#00d455">Betslip</div><div>Join Now</div><div>Account</div></div>
</div>

<script>
function switchTab(t){
 document.getElementById('loginForm').style.display=t==='login'?'block':'none';
 document.getElementById('joinForm').style.display=t==='join'?'block':'none';
 document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('active',(t==='login'&&i===0)||(t==='join'&&i===1))})
}
function login(){
 let m=document.getElementById('lmobile').value;
 let p=document.getElementById('lpass').value;
 let err=document.getElementById('lmobileErr');
 if(m.length<9||m.length>10){err.innerText='Your mobile number should be 9-10 digits';return}
 if(p.length<4){alert('Password min 4 chars');return}
 alert('DEMO LOGIN SUCCESS\\nMobile: '+m+'\\n\\nThis is demo only - no real betPawa account');
 // go to your aviator
 window.location.href='aviator.html';
}
function join(){
 let m=document.getElementById('jmobile').value;
 if(m.length<9){alert('Please enter your mobile phone number');return}
 alert('DEMO ACCOUNT CREATED\\nWelcome '+document.getElementById('fname').value+'\\n\\nThis is KikuyuBet DEMO - not real betPawa. Now you can play aviator demo.');
 window.location.href='aviator.html';
}
</script>
</body>
</html>
