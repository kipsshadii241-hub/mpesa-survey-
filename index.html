<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Betpawa Aviator - Demo</title>
<style>
*{box-sizing:border-box;font-family:Inter,Segoe UI,Roboto,sans-serif}
body{margin:0;background:#0e0e0e;color:#fff}
.header{background:#1f8f2a;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:800}
.balance{background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:6px 12px;color:#7bff8a}
.wrap{max-width:480px;margin:0 auto;padding:12px}
.gamebox{background:#171717;border-radius:14px;overflow:hidden;position:relative;height:280px;border:1px solid #222}
canvas{width:100%;height:100%;display:block}
.multiplier{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:54px;font-weight:900}
.crash{color:#ff3b30}.fly{color:#7bff8a}
.history{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.chip{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;flex-shrink:0}
.chip.low{background:#2a3a6b;color:#8ab4ff}
.chip.mid{background:#3a2a6b;color:#d8abff}
.chip.high{background:#6b2a2a;color:#ff9a9a}
.controls{background:#1e1e1e;border-radius:14px;padding:14px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;border:1px solid #2a2a2a}
.betbox{background:#111;border-radius:10px;padding:10px;border:1px solid #2a2a2a}
.betbox label{font-size:11px;color:#999}
.betbox input{width:100%;background:transparent;border:0;color:#fff;font-size:18px;font-weight:800;outline:none;margin-top:4px}
.btn{border:0;border-radius:10px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}
.btn-bet{background:#1f8f2a;color:white}
.btn-cash{background:#ffb700;color:#000}
</style>
</head>
<body>
<div class="header"><span>betPawa | AVIATOR</span><div class="balance">KES <span id="bal">5000.00</span> DEMO</div></div>
<div class="wrap">
<div class="history" id="history"></div>
<div class="gamebox"><canvas id="c"></canvas><div id="mult" class="multiplier fly">1.00x</div></div>
<div class="controls">
<div class="betbox"><label>BET 1</label><input id="bet1" type="number" value="100"><button id="btn1" class="btn btn-bet" style="width:100%;margin-top:10px" onclick="place(1)">BET</button><div id="win1" style="font-size:11px;color:#777;text-align:center"></div></div>
<div class="betbox"><label>BET 2</label><input id="bet2" type="number" value="100"><button id="btn2" class="btn btn-bet" style="width:100%;margin-top:10px" onclick="place(2)">BET</button><div id="win2" style="font-size:11px;color:#777;text-align:center"></div></div>
</div>
<p style="font-size:11px;color:#777;text-align:center">⚠️ DEMO ONLY - No real money</p>
</div>
<script>
let bal=5000,mult=1.00,flying=false,crashPoint=0,interval=null,bets=[null,null];
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;}resize();
let history=[2.13,1.45,8.23,1.07,3.44,1.89,12.5,2.01];
function renderHistory(){document.getElementById('history').innerHTML=history.slice(0,12).map(v=>{let cls=v<2?'low':v<5?'mid':'high';return `<div class="chip ${cls}">${v.toFixed(2)}x</div>`;}).join('');}renderHistory();
function genCrash(){let r=Math.random();if(r<0.05)return 1.00+Math.random()*0.2;let crash=0.98/(1-r);return Math.max(1.01,Math.min(100,crash));}
function place(n){if(flying){cashout(n);return}let amt=parseFloat(document.getElementById('bet'+n).value);if(amt>bal){alert('Insufficient');return}bal-=amt;document.getElementById('bal').innerText=bal.toFixed(2);bets[n-1]={amt,active:true,cashed:false};document.getElementById('btn'+n).innerText='CASHOUT';document.getElementById('btn'+n).className='btn btn-cash';}
function cashout(n){let b=bets[n-1];if(!b||!b.active||b.cashed||!flying)return;let win=b.amt*mult;b.cashed=true;b.active=false;bal+=win;document.getElementById('bal').innerText=bal.toFixed(2);document.getElementById('win'+n).innerText=`Won ${win.toFixed(2)}`;document.getElementById('btn'+n).innerText='BET';document.getElementById('btn'+n).className='btn btn-bet';}
function startRound(){if(flying)return;mult=1.00;crashPoint=genCrash();flying=true;document.getElementById('mult').className='multiplier fly';let start=Date.now();interval=setInterval(()=>{let elapsed=(Date.now()-start)/1000;mult=Math.pow(1.06,elapsed*2.5);if(mult>=crashPoint){clearInterval(interval);flying=false;document.getElementById('mult').innerText=crashPoint.toFixed(2)+'x';document.getElementById('mult').className='multiplier crash';history.unshift(crashPoint);renderHistory();bets=[null,null];document.getElementById('btn1').innerText='BET';document.getElementById('btn1').className='btn btn-bet';document.getElementById('btn2').innerText='BET';document.getElementById('btn2').className='btn btn-bet';setTimeout(startRound,3000);}else{document.getElementById('mult').innerText=mult.toFixed(2)+'x';}},50);}
setTimeout(startRound,1000);
</script>
</body>
</html>
